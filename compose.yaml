services:
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      APP_ENV: production
      AUTH_MODE: ${AUTH_MODE:-cloudflare}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      DATABASE_URL: sqlite:////data/lh_agent.db
      CF_ACCESS_ISSUER: ${CF_ACCESS_ISSUER:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.deepinfra.com/v1/openai}
      MODEL_NAME: ${MODEL_NAME:-deepseek-ai/DeepSeek-V4.1-Flash-1017}
      OTEL_SDK_DISABLED: 'true'
    volumes: [lh-data:/data]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?set verified CLOUDFLARED_IMAGE}
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
volumes:
  lh-data:
