services:
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      APP_BIND_ADDR: 0.0.0.0:3000
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --max-time, '3', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
